<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"><rect width="1200" height="420" rx="14" fill="#fcfcfb" stroke="#d9d7cf"/><g transform="translate(64,64) scale(0.9166666666666666)"><rect width="96" height="96" rx="22" fill="#2a78d6"/><g stroke="#fff" stroke-width="9" stroke-linecap="round" fill="none"><path d="M16 30 H46"/><path d="M24 48 H50"/><path d="M16 66 H46"/><path d="M56 24 L78 48 L56 72" stroke-linejoin="round"/></g></g><text x="176" y="110" font-size="60" fill="#0b0b0b" font-weight="700" text-anchor="start">Sonic LLM</text><text x="178" y="146" font-size="24" fill="#52514e" font-weight="400" text-anchor="start">One Mac, many agents.</text><text x="64" y="212" font-size="21" fill="#52514e" font-weight="400" text-anchor="start">A local LLM server for Apple Silicon. Same GGUF files and same interface as llama.cpp,</text><text x="64" y="240" font-size="21" fill="#52514e" font-weight="400" text-anchor="start">same answers, and several times faster when many requests run together.</text><rect x="64" y="276" width="259" height="112" rx="12" fill="#f3f2ee"/><text x="82" y="322" font-size="34" fill="#1f5fb0" font-weight="700" text-anchor="start">3.7x-6.3x</text><text x="82" y="348" font-size="14.5" fill="#0b0b0b" font-weight="400" text-anchor="start">faster: 16 questions</text><text x="82" y="368" font-size="12.5" fill="#52514e" font-weight="400" text-anchor="start">about one document</text><rect x="335" y="276" width="259" height="112" rx="12" fill="#f3f2ee"/><text x="353" y="322" font-size="34" fill="#1f5fb0" font-weight="700" text-anchor="start">2.0x-3.9x</text><text x="353" y="348" font-size="14.5" fill="#0b0b0b" font-weight="400" text-anchor="start">faster: 32 requests</text><text x="353" y="368" font-size="12.5" fill="#52514e" font-weight="400" text-anchor="start">sent at once</text><rect x="606" y="276" width="259" height="112" rx="12" fill="#f3f2ee"/><text x="624" y="322" font-size="34" fill="#1f5fb0" font-weight="700" text-anchor="start">0.1 s</text><text x="624" y="348" font-size="14.5" fill="#0b0b0b" font-weight="400" text-anchor="start">to a chat's first word while</text><text x="624" y="368" font-size="12.5" fill="#52514e" font-weight="400" text-anchor="start">8 agents work (llama.cpp: 18-52 s)</text><rect x="877" y="276" width="259" height="112" rx="12" fill="#f3f2ee"/><text x="895" y="322" font-size="34" fill="#1f5fb0" font-weight="700" text-anchor="start">103 of 112</text><text x="895" y="348" font-size="14.5" fill="#0b0b0b" font-weight="400" text-anchor="start">model-and-mode cells</text><text x="895" y="368" font-size="12.5" fill="#52514e" font-weight="400" text-anchor="start">faster than llama.cpp</text><text x="1136" y="110" font-size="14" fill="#8a897f" font-weight="400" text-anchor="end">vs llama-server build 11669</text><text x="1136" y="130" font-size="14" fill="#8a897f" font-weight="400" text-anchor="end">Apple M5 Pro, 48 GB, one run per cell</text></svg>
