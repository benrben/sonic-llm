<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"><rect width="1200" height="380" rx="14" fill="#1a1a19" stroke="#3a3a36"/><text x="40" y="48" font-size="24" fill="#f0efec" font-weight="700" text-anchor="start">Why many questions about one document are fast</text><rect x="40" y="76" width="540" height="270" rx="12" fill="#242423"/><text x="64" y="110" font-size="17" fill="#f0efec" font-weight="700" text-anchor="start">Without shared reading</text><text x="64" y="132" font-size="13.5" fill="#c3c2b7" font-weight="400" text-anchor="start">every request reads the whole document</text><rect x="64" y="154" width="300" height="30" rx="6" fill="#3987e5"/><text x="214" y="174" font-size="13.5" fill="#fff" font-weight="600" text-anchor="middle">document, read again</text><rect x="372" y="154" width="60" height="30" rx="6" fill="#d95926"/><text x="444" y="174" font-size="13.5" fill="#c3c2b7" font-weight="400" text-anchor="start">question 1</text><rect x="64" y="198" width="300" height="30" rx="6" fill="#3987e5"/><text x="214" y="218" font-size="13.5" fill="#fff" font-weight="600" text-anchor="middle">document, read again</text><rect x="372" y="198" width="60" height="30" rx="6" fill="#d95926"/><text x="444" y="218" font-size="13.5" fill="#c3c2b7" font-weight="400" text-anchor="start">question 2</text><rect x="64" y="242" width="300" height="30" rx="6" fill="#3987e5"/><text x="214" y="262" font-size="13.5" fill="#fff" font-weight="600" text-anchor="middle">document, read again</text><rect x="372" y="242" width="60" height="30" rx="6" fill="#d95926"/><text x="444" y="262" font-size="13.5" fill="#c3c2b7" font-weight="400" text-anchor="start">question 3</text><rect x="64" y="286" width="300" height="30" rx="6" fill="#3987e5"/><text x="214" y="306" font-size="13.5" fill="#fff" font-weight="600" text-anchor="middle">document, read again</text><rect x="372" y="286" width="60" height="30" rx="6" fill="#d95926"/><text x="444" y="306" font-size="13.5" fill="#c3c2b7" font-weight="400" text-anchor="start">question 4</text><rect x="620" y="76" width="540" height="270" rx="12" fill="#242423"/><text x="644" y="110" font-size="17" fill="#f0efec" font-weight="700" text-anchor="start">Sonic LLM</text><text x="644" y="132" font-size="13.5" fill="#c3c2b7" font-weight="400" text-anchor="start">the shared start is read once; each request reads only its question</text><rect x="644" y="154" width="300" height="162" rx="6" fill="#3987e5"/><text x="794" y="242" font-size="15" fill="#fff" font-weight="700" text-anchor="middle">document, read once</text><rect x="952" y="154" width="60" height="30" rx="6" fill="#d95926"/><text x="1024" y="174" font-size="13.5" fill="#c3c2b7" font-weight="400" text-anchor="start">question 1</text><rect x="952" y="198" width="60" height="30" rx="6" fill="#d95926"/><text x="1024" y="218" font-size="13.5" fill="#c3c2b7" font-weight="400" text-anchor="start">question 2</text><rect x="952" y="242" width="60" height="30" rx="6" fill="#d95926"/><text x="1024" y="262" font-size="13.5" fill="#c3c2b7" font-weight="400" text-anchor="start">question 3</text><rect x="952" y="286" width="60" height="30" rx="6" fill="#d95926"/><text x="1024" y="306" font-size="13.5" fill="#c3c2b7" font-weight="400" text-anchor="start">question 4</text></svg>
