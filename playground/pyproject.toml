[project]
name = "sonic-playground"
version = "0.2.0"
description = "Sonic LLM playground: run live tests on your models in a browser, optionally beside llama.cpp"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.162.0",
    "httpx==0.28.1",
    "jinja2==3.1.6",
    "uvicorn==0.54.0",
]

[project.scripts]
sonic-playground = "sonic_playground.cli:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "sonic_playground"

[dependency-groups]
dev = [
    "playwright==1.64.1",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
